[package]
name = "llrc"
version = "0.4.5"
edition = "2021"
license = "MIT"

[[bin]]
name = "llrc"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { version = "0.136", features = ["x86", "arm64", "riscv64", "s390x"] }
cranelift-frontend = "0.136"
cranelift-module = "0.136"
cranelift-object = "0.136"
cranelift-native = "0.136"
target-lexicon = "0.13"
